<style>
/* ---------- Tokens ---------- */
:root{
  --spring: cubic-bezier(.2,1.12,.32,1);
  --spring-dur: .55s;
  --ease-out: cubic-bezier(.16,1,.3,1);
  --r-xl: 30px; --r-lg: 26px; --r-md: 20px; --r-sm: 14px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tab-h: 66px;
}
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --bg0:#05071a; --bg1:#0a0e2e; --bg2:#17124a;
  --glow: rgba(139,108,255,.17);
  --text:#f4f6ff; --text2:#c1c6e2; --text3:#959cc0;
  --on-text:#0b0e2a;
  --g1: rgba(255,255,255,.085); --g2: rgba(255,255,255,.035);
  --tile: rgba(255,255,255,.05);
  --field: rgba(255,255,255,.07);
  --field-focus: rgba(255,255,255,.11);
  --border: rgba(255,255,255,.12);
  --border-2: rgba(255,255,255,.2);
  --hl: inset 0 1px 0 rgba(255,255,255,.13);
  --shadow: 0 18px 40px -18px rgba(0,0,0,.65);
  --bar-bg: rgba(16,20,54,.58);
  --panel: #0c1034;
  --panel-2: rgba(12,16,52,.94);
  --backdrop: rgba(3,4,16,.58);
  --income:#74e6b5; --spend:#ff978a;
  --income-bg: rgba(116,230,181,.13); --spend-bg: rgba(255,151,138,.13);
  --accent-a:#93b3ff; --accent-b:#bd97ff;
  --accent-ink:#0a0c26;
  --accent-text:#c6d3ff;
  --grid: rgba(255,255,255,.08);
  --axis: rgba(255,255,255,.22);
  --thumb: rgba(255,255,255,.15);
  --danger:#ff8a80;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg0:#f2f3fb; --bg1:#e9eafa; --bg2:#ddd7f7;
  --glow: rgba(139,108,255,.16);
  --text:#12142c; --text2:#40456a; --text3:#5b6187;
  --on-text:#ffffff;
  --g1: rgba(255,255,255,.78); --g2: rgba(255,255,255,.52);
  --tile: rgba(255,255,255,.55);
  --field: rgba(255,255,255,.7);
  --field-focus: rgba(255,255,255,.95);
  --border: rgba(30,34,90,.10);
  --border-2: rgba(30,34,90,.18);
  --hl: inset 0 1px 0 rgba(255,255,255,.9);
  --shadow: 0 18px 40px -22px rgba(40,40,120,.35);
  --bar-bg: rgba(255,255,255,.66);
  --panel: #f1f2fb;
  --panel-2: rgba(244,245,253,.96);
  --backdrop: rgba(20,22,60,.28);
  --income:#0a8558; --spend:#cf4334;
  --income-bg: rgba(10,133,88,.11); --spend-bg: rgba(207,67,52,.10);
  --accent-a:#5d7cf5; --accent-b:#8f62ee;
  --accent-ink:#ffffff;
  --accent-text:#3c4fc9;
  --grid: rgba(20,22,60,.08);
  --axis: rgba(20,22,60,.22);
  --thumb: rgba(255,255,255,.95);
  --danger:#c93a2c;
}

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--font); color:var(--text); background:var(--bg0);
  font-size:15px; line-height:1.4; min-height:100vh; min-height:100dvh;
  font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1, "cv11" 1;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
.ic{width:20px;height:20px;flex:none}
.bg{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(90% 55% at 88% -8%, var(--glow), transparent 62%),
    linear-gradient(168deg, var(--bg0) 0%, var(--bg1) 46%, var(--bg2) 100%);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px}

/* ---------- Glass ---------- */
.glass{
  background:linear-gradient(180deg,var(--g1),var(--g2));
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--hl), var(--shadow);
}
.blur{ -webkit-backdrop-filter:blur(24px) saturate(165%); backdrop-filter:blur(24px) saturate(165%); }
.card{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-size:15px;font-weight:650;font-weight:600;letter-spacing:-.01em}
.card-s{font-size:13px;color:var(--text3)}
.link{font-size:13px;font-weight:600;color:var(--accent-text);display:inline-flex;align-items:center;gap:2px;padding:6px 2px}
.link .ic{width:16px;height:16px}
.muted{color:var(--text3)}
.t2{color:var(--text2)}
.inc{color:var(--income)} .exp{color:var(--spend)}

/* ---------- Layout ---------- */
#main{min-height:100vh}
#page{
  max-width:600px;margin:0 auto;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 170px);
}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.page-h h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.page-h .sub{font-size:13px;color:var(--text3);margin-top:4px;font-weight:500}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stack > *, .dash-grid > *, .dash-col > *{min-width:0}
.section-t{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}

.sidebar{display:none}
@media (min-width: 960px){
  .tabbar,.fab{display:none !important}
  .sidebar{
    display:flex;flex-direction:column;gap:18px;position:fixed;z-index:30;
    left:16px;top:16px;bottom:16px;width:236px;padding:22px 14px;border-radius:var(--r-xl);
  }
  #page{max-width:1120px;margin-left:268px;margin-right:auto;padding:28px 32px 60px}
  #dgrid.dash-grid{grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); align-items:start}
  .dash-col{display:grid;gap:14px}
  .hist-wrap{max-width:760px}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
  clip-path:polygon(50% 8%, 94% 88%, 6% 88%)}
.side-nav{display:grid;gap:4px}
.side-nav button{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:16px;color:var(--text2);font-weight:500;text-align:left;
  transition:background .2s, color .2s}
.side-nav button:hover{background:var(--tile)}
.side-nav button.on{background:var(--thumb);color:var(--text);box-shadow:var(--hl)}
.side-foot{margin-top:auto;font-size:12px;color:var(--text3);padding:0 8px}

/* ---------- Tab bar & add button ---------- */
.tabbar{
  position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:min(calc(100% - 24px), 480px);height:var(--tab-h);transform:translateX(-50%);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:33px;
  background:var(--bar-bg);border:1px solid var(--border);box-shadow:var(--hl),0 16px 40px -12px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:27px;
  background:var(--thumb);box-shadow:var(--hl);transform:translateX(calc(var(--ti,0) * 100%));
  transition:transform var(--spring-dur) var(--spring)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--text3);letter-spacing:-.01em;transition:color .25s}
.tab .ic{width:21px;height:21px}
.tab.on{color:var(--text)}
.tab:active .ic{transform:scale(.88)}
.tab .ic{transition:transform .35s var(--spring)}

.add-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px 0 20px;border-radius:28px;
  background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:var(--accent-ink);font-weight:700;font-size:16px;letter-spacing:-.01em;
  box-shadow:0 12px 30px -8px rgba(140,120,255,.65), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform var(--spring-dur) var(--spring), opacity .3s;
}
.add-btn .ic{width:22px;height:22px;stroke-width:2.6}
.add-btn:active{transform:scale(.93)}
.fab{position:fixed;z-index:41;right:16px;bottom:calc(env(safe-area-inset-bottom) + var(--tab-h) + 24px)}
.fab.hide{opacity:0;transform:translateY(20px) scale(.9);pointer-events:none}
.side-add{width:100%}

/* ---------- Controls ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--border);
  background:var(--field);color:var(--text2);font-weight:600;font-size:14px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;position:relative;
  transition:transform .45s var(--spring), background .25s, color .25s;
}
.pill:active{transform:scale(.94)}
.pill.on{background:var(--text);color:var(--on-text);border-color:transparent}
.pill .ic{width:16px;height:16px}
.pill small{font-weight:500;opacity:.7;font-size:12px}
.pill select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.pill.set{border-color:var(--border-2);color:var(--text)}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:24px;background:var(--field);border:1px solid var(--border)}
.seg button{position:relative;z-index:1;height:38px;border-radius:20px;font-weight:600;font-size:14px;color:var(--text3);transition:color .25s;white-space:nowrap;padding:0 8px}
.seg button.on{color:var(--text)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:20px;background:var(--thumb);box-shadow:var(--hl), 0 4px 12px -4px rgba(0,0,0,.3);
  transition:transform var(--spring-dur) var(--spring)}

.field{display:grid;gap:6px}
.field > span{font-size:12.5px;font-weight:600;color:var(--text3);padding-left:4px}
.input,.select{
  width:100%;height:48px;border-radius:24px;border:1px solid var(--border);background:var(--field);padding:0 18px;outline:none;
  transition:background .2s,border-color .2s;-webkit-appearance:none;appearance:none;font-size:16px;
}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:calc(100% - 22px) 21px, calc(100% - 17px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.select option{color:#111;background:#fff}
.input:focus,.select:focus{background:var(--field-focus);border-color:var(--border-2)}
.input::placeholder{color:var(--text3)}
input[type="date"].input{display:flex;align-items:center;min-width:0}
.search{position:relative}
.search .ic{position:absolute;left:16px;top:14px;color:var(--text3);width:19px;height:19px}
.search .input{padding-left:46px}
.search .clear{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--text3)}

.btn{height:48px;padding:0 20px;border-radius:24px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--field);border:1px solid var(--border);transition:transform .45s var(--spring),background .2s}
.btn:active{transform:scale(.95)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:var(--accent-ink);border:0;font-weight:700;
  box-shadow:0 10px 26px -10px rgba(140,120,255,.7), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.danger{color:var(--danger)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:19px}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--field);border:1px solid var(--border);
  transition:transform .45s var(--spring)}
.icon-btn:active{transform:scale(.9)}

.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:15px;background:var(--field);border:1px solid var(--border-2);transition:background .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);
  transition:transform .5s var(--spring)}
.switch input:checked + i{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));border-color:transparent}
.switch input:checked + i::after{transform:translateX(20px)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--field);border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:13px;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--field)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:12px;background:#fff;border:0}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:650;font-weight:600;
  background:var(--tile);border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.9}
.badge.b-active{color:var(--income);background:var(--income-bg);border-color:transparent}
.badge.b-paused{color:#f1c463}
:root[data-theme="light"] .badge.b-paused{color:#8a5d00}
.badge.b-cancelled{color:var(--text3)}
.badge.b-trial{color:var(--accent-text);background:rgba(147,179,255,.12);border-color:transparent}
.badge.b-trial::before,.badge.plain::before{display:none}
.badge.b-planned{color:var(--accent-text)}

/* ---------- Icons in circles ---------- */
.cico{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;flex:none;background:var(--c-bg);color:var(--c)}
.cico .ic{width:20px;height:20px}
.cico.sm{width:34px;height:34px;border-radius:17px}
.cico.sm .ic{width:17px;height:17px}
.dot-c{width:8px;height:8px;border-radius:4px;flex:none;background:var(--c)}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}
.dash-head .hello{font-size:13px;color:var(--text3);font-weight:500}
.dash-head h1{font-size:28px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.month-pills{margin-bottom:6px}
.dash-grid{display:grid;gap:14px}
.dash-col{display:contents}

.car{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:12px 0 10px;
  overscroll-behavior-x:contain;cursor:grab}
.car::-webkit-scrollbar{display:none}
.car.drag{scroll-snap-type:none;cursor:grabbing}
.car-pad{flex:0 0 calc((100% - var(--sw))/2)}
.car{--sw:min(74%, 330px)}
.car-slot{flex:0 0 var(--sw);scroll-snap-align:center;scroll-snap-stop:always;padding:0 5px}
.acc{
  position:relative;height:184px;border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;overflow:hidden;
  transform-origin:50% 55%;will-change:transform,opacity;
  background:
    radial-gradient(120% 90% at 100% 0%, var(--ca, rgba(255,255,255,.12)), transparent 60%),
    linear-gradient(160deg, var(--g1), var(--g2));
  border:1px solid var(--border);box-shadow:var(--hl), 0 22px 40px -22px rgba(0,0,0,.7);
  user-select:none;-webkit-user-select:none;
}
.acc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 32%);}
:root[data-theme="light"] .acc::after{background:linear-gradient(115deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 35%)}
.acc-top{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.acc-top > span:nth-child(2){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-top .cico{width:34px;height:34px}
.acc-top .cico .ic{width:17px;height:17px}
.acc-kind{margin-left:auto;flex:none;font-size:11.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.acc-bal{margin-top:auto;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.acc-sub{margin-top:6px;font-size:12.5px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap;min-height:18px}
.acc-sub b{font-weight:600}
.acc-chips{display:flex;gap:4px;margin-top:8px}
.acc-chips i{width:22px;height:6px;border-radius:3px;background:var(--c)}
.dots{display:flex;justify-content:center;gap:7px;margin:2px 0 4px;height:10px;align-items:center}
.dots button{width:7px;height:7px;border-radius:4px;background:var(--text3);opacity:.4;transition:transform .45s var(--spring),opacity .3s;padding:0}
.dots button.on{opacity:1;transform:scale(1.35);background:var(--text)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:22px;background:var(--tile);border:1px solid var(--border);padding:13px 13px 12px;min-width:0;text-align:left;display:block;width:100%;
  transition:transform .45s var(--spring)}
.tile:active{transform:scale(.97)}
.tile-l{font-size:12.5px;font-weight:600;color:var(--text3);display:flex;align-items:center;gap:6px}
.tile-l .ic{width:15px;height:15px}
.tile-v{font-size:20px;font-weight:700;letter-spacing:-.025em;margin-top:2px;white-space:nowrap}
.tile-d{font-size:11.5px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:64px;margin-top:8px;overflow:visible}
.ring-wrap{display:flex;align-items:center;gap:9px;margin-top:10px}
.ring{width:58px;height:58px;flex:none}
.legend{display:grid;gap:3px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);min-width:0}
.legend span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.legend b{font-weight:600;color:var(--text)}
.tile{display:flex;flex-direction:column}
.tile .spark{margin-top:auto;padding-top:8px;height:72px}
@media (max-width: 520px){
  .ring-wrap{flex-direction:row;align-items:center;flex-wrap:wrap}
  .ring{width:54px;height:54px}
  .legend{flex:1 0 100%;margin-top:4px}
  .legend div:nth-child(4){display:none}
}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}

.free{
  position:relative;overflow:hidden;
  background:
    radial-gradient(100% 120% at 0% 0%, rgba(147,179,255,.24), transparent 55%),
    radial-gradient(90% 120% at 100% 100%, rgba(189,151,255,.2), transparent 60%),
    linear-gradient(180deg,var(--g1),var(--g2));
  border-color:rgba(170,180,255,.32);
  text-align:left;width:100%;display:block;
}
:root[data-theme="light"] .free{border-color:rgba(93,124,245,.3)}
.free-l{font-size:13px;font-weight:600;color:var(--accent-text);display:flex;align-items:center;gap:6px}
.free-v{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-top:6px;white-space:nowrap}
.free-d{font-size:13px;color:var(--text2);margin-top:4px}
.free-m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.free-m div{border-radius:16px;background:var(--tile);border:1px solid var(--border);padding:9px 10px;min-width:0}
.free-m small{display:block;font-size:11.5px;color:var(--text3);font-weight:600}
.free-m b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--spend)}

/* ---------- Rows ---------- */
.rows{display:grid;grid-template-columns:minmax(0,1fr)}
.dash-grid{grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;min-height:60px;width:100%;text-align:left;border-radius:16px}
.row + .row{border-top:1px solid var(--border)}
.row-m{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row-s{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-a{font-weight:650;font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.row-a small{display:block;font-size:11.5px;color:var(--text3);font-weight:500}
.datechip{width:44px;height:46px;border-radius:14px;background:var(--tile);border:1px solid var(--border);display:grid;place-content:center;text-align:center;flex:none;line-height:1.05}
.datechip b{font-size:17px;font-weight:700}
.datechip small{font-size:10.5px;color:var(--text3);font-weight:600;text-transform:lowercase}
.empty{padding:22px 8px;text-align:center;color:var(--text3);font-size:14px}

/* History swipe rows */
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 8px 6px;font-size:13px;font-weight:600;color:var(--text3)}
.day-h b{color:var(--text2);font-weight:600}
.day-group{border-radius:var(--r-md);overflow:hidden}
.txw{position:relative;overflow:hidden;transition:height .26s var(--ease-out), opacity .2s}
.txw + .txw .txr{border-top:1px solid var(--border)}
.tx-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:700;font-size:14px;opacity:0}
.tx-bg span{display:flex;align-items:center;gap:8px}
.tx-bg.l{opacity:1;background:linear-gradient(90deg, rgba(255,138,128,0), rgba(232,92,80,.85));color:#fff}
.tx-bg.l .be{visibility:hidden}
.tx-bg.r{opacity:1;background:linear-gradient(90deg, rgba(110,140,255,.85), rgba(110,140,255,0));color:#fff}
.tx-bg.r .bd{visibility:hidden}
.txr{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;background:var(--panel-row, transparent);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.hist-list .day-group{background:linear-gradient(180deg,var(--g1),var(--g2));border:1px solid var(--border);box-shadow:var(--hl)}
.hist-list .txr{background:var(--row-solid)}
:root,:root[data-theme="dark"]{--row-solid:#11163c}
:root[data-theme="light"]{--row-solid:#f7f7fd}
.txr.anim{transition:transform .5s var(--spring)}
.slide-in{animation:slideIn .6s var(--spring) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-28px) scale(.98)}to{opacity:1;transform:none}}

.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totals div{min-width:0}
.totals small{display:block;font-size:12px;font-weight:600;color:var(--text3)}
.totals b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-tools{display:grid;gap:10px;margin-bottom:12px}
.range-custom{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- Timeline ---------- */
.tl-chart{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tl-chart text{font-family:var(--font);font-size:11px;fill:var(--text3);font-variant-numeric:tabular-nums}
.tl-chart .lbl-on{fill:var(--text);font-weight:700}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text2);margin-top:10px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
.chart-legend i.line{height:2px;border-radius:1px;width:16px}
.chart-legend i.dash{height:0;width:16px;border-top:2px dashed var(--c);background:none;border-radius:0}
.chart-legend i.band{background:var(--c);opacity:.35}
.chart-legend i.fc{background:none;border:1.5px dashed var(--c)}
.tl-controls{display:grid;gap:10px;margin-bottom:14px}
.bd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bd-title{font-size:19px;font-weight:700;letter-spacing:-.02em}
.saved{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-weight:700;font-size:13px;background:var(--income-bg);color:var(--income);white-space:nowrap}
.saved.bad{background:var(--spend-bg);color:var(--spend)}
.bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.bd-grid div{border-radius:16px;background:var(--tile);border:1px solid var(--border);padding:10px;min-width:0}
.bd-grid small{display:block;font-size:11.5px;color:var(--text3);font-weight:600}
.bd-grid b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;gap:10px;margin-top:10px}
.barrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.barrow .n{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.barrow .track{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--tile);overflow:hidden;margin-top:-4px}
.barrow .track i{display:block;height:100%;border-radius:3px;background:var(--c);transform-origin:left;transform:scaleX(var(--w));transition:transform .8s var(--spring)}
.entering .barrow .track i, .detail-content .barrow .track i{animation:growX .9s var(--spring) both}
@keyframes growX{from{transform:scaleX(0)}}
.wi-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.wi-row + .wi-row{border-top:1px solid var(--border)}
.wi-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--tile);border:1px solid var(--border)}
.wi-sum b{font-size:17px}

/* ---------- Recurring ---------- */
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum2 small{display:block;font-size:12px;font-weight:600;color:var(--text3)}
.sum2 b{display:block;font-size:22px;font-weight:700;letter-spacing:-.025em;white-space:nowrap}
.rc{padding:14px;border-radius:var(--r-md)}
.rc-main{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-width:0}
.rc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rc-actions{display:flex;gap:8px;margin-top:12px}
.rc-actions .btn{flex:1}
.rc.is-cancelled{opacity:.78}
.rc.is-cancelled .row-a{text-decoration:line-through;text-decoration-color:var(--text3)}
.savebox{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--income-bg);margin-bottom:10px}
.savebox b{font-size:18px;color:var(--income)}
.list-anim > *{transition:transform .5s var(--spring), opacity .3s}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 2px;width:100%;text-align:left}
.set-row + .set-row{border-top:1px solid var(--border)}
.set-row .chev{color:var(--text3);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 5px;border-radius:21px;background:var(--field);border:1px solid var(--border);font-weight:600;font-size:14px;
  transition:transform .45s var(--spring), background .2s, border-color .2s;white-space:nowrap}
.chip .cico{width:32px;height:32px}
.chip .cico .ic{width:16px;height:16px}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--thumb);border-color:var(--border-2);box-shadow:var(--hl), 0 0 0 2px var(--c, var(--accent-a)) inset}
.chip.plain{padding:0 16px}
.rate-row{display:grid;grid-template-columns:auto 1fr 120px;gap:12px;align-items:center;padding:10px 0}
.rate-row + .rate-row{border-top:1px solid var(--border)}
.rate-row .input{height:42px;font-size:15px;padding:0 14px;text-align:right}
.rate-meta{margin:2px 0 4px}
.rate-meta div{padding:8px 2px;font-size:14px}
.rate-status{min-height:20px;font-size:13px;font-weight:600;color:var(--accent-text);padding:2px 2px 6px}
.rate-status:empty{display:none}
.rate-status.bad{color:var(--danger)}
.btn.spinning .ic{animation:spin .9s linear infinite}
.btn[disabled]{opacity:.75;cursor:progress}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .btn.spinning .ic{animation:none !important} }
.cur-tag{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--tile);border:1px solid var(--border)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:17px;background:var(--c);border:2px solid transparent;transition:transform .4s var(--spring)}
.swatches button.on{border-color:var(--text);transform:scale(1.1)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icon-grid button{height:44px;border-radius:14px;display:grid;place-items:center;background:var(--field);border:1px solid var(--border);color:var(--text2)}
.icon-grid button.on{background:var(--thumb);color:var(--text);border-color:var(--border-2)}

/* ---------- Sheets & detail ---------- */
.layer{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .35s}
.layer.open .backdrop{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 24px);
  display:flex;flex-direction:column;border-radius:30px 30px 0 0;
  background:var(--panel-2);border:1px solid var(--border);border-bottom:0;box-shadow:var(--hl), 0 -20px 50px -20px rgba(0,0,0,.6);
  transform:translateY(105%);transition:transform var(--spring-dur) var(--spring);will-change:transform;
}
.layer.open .sheet{transform:none}
.sheet.dragging,.detail.dragging{transition:none !important}
.grab{flex:none;padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--text3);opacity:.5}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 18px 10px;touch-action:none}
.sheet-h h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:4px 18px calc(env(safe-area-inset-bottom) + 20px);display:grid;gap:16px;-webkit-overflow-scrolling:touch}
@media (min-width: 700px){
  .sheet{bottom:24px;border-radius:30px;border-bottom:1px solid var(--border);max-height:calc(100% - 48px)}
}
.amount-box{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0 2px}
.amount-in{width:100%;max-width:100%;border:0;background:none;outline:none;text-align:center;font-size:46px;font-weight:800;letter-spacing:-.035em;caret-color:var(--accent-a);padding:0}
.amount-in::placeholder{color:var(--text3);opacity:.6}
.amount-cur{font-size:22px;font-weight:700;color:var(--text3)}
.amount-wrap{border-radius:26px;background:var(--tile);border:1px solid var(--border);padding:10px 16px 12px}
.amount-wrap small{display:block;text-align:center;font-size:12.5px;color:var(--text3);min-height:17px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.hscroll::-webkit-scrollbar{display:none}
.cat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.cat-grid::-webkit-scrollbar{display:none}
.note-plan{font-size:12.5px;color:var(--accent-text);padding:0 6px}
.sheet-foot{display:flex;gap:8px}
.sheet-foot .primary{flex:1;height:54px;font-size:16.5px;border-radius:27px}

.detail-layer .backdrop{background:var(--backdrop)}
.detail{position:absolute;inset:0;margin:0 auto;max-width:640px;will-change:transform}
@media (min-width: 700px){ .detail{top:24px;bottom:24px} }
.detail-bg{position:absolute;inset:0;border-radius:0;background:var(--panel);border:1px solid var(--border);transform-origin:0 0;will-change:transform,opacity;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
@media (min-width: 700px){ .detail-bg{border-radius:30px} }
.detail-content{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(14px);transition:opacity .3s ease, transform .55s var(--spring)}
.detail.shown .detail-content{opacity:1;transform:none}
.detail-h{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;touch-action:none}
.detail-h h2{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-s{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(env(safe-area-inset-bottom) + 30px);display:grid;gap:14px;align-content:start}
.hero{padding:6px 4px}
.hero small{display:block;font-size:13px;font-weight:600;color:var(--text3)}
.hero b{display:block;font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:4px}
.hero span{display:block;font-size:13.5px;color:var(--text2);margin-top:4px}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;font-size:14.5px}
.kv div + div{border-top:1px solid var(--border)}
.kv div b{font-weight:650;font-weight:600;white-space:nowrap}
.kv div.total{font-size:16px}
.kv div.total b{font-weight:800}

/* ---------- Toast & dialog ---------- */
#toasts{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--tab-h) + 96px);transform:translateX(-50%);width:min(calc(100% - 32px),420px);display:grid;gap:8px;pointer-events:none}
@media (min-width:960px){#toasts{bottom:28px;left:calc(50% + 134px)}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;min-height:52px;border-radius:26px;
  background:var(--bar-bg);border:1px solid var(--border);box-shadow:var(--hl),0 16px 40px -14px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  font-weight:600;font-size:14.5px;animation:toastIn .6s var(--spring) both}
.toast span{flex:1}
.toast .btn{height:36px;font-size:13.5px;padding:0 14px}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
.dialog{position:absolute;left:50%;top:50%;width:min(calc(100% - 40px),380px);padding:22px;border-radius:28px;background:var(--panel-2);border:1px solid var(--border);
  box-shadow:var(--hl),0 30px 60px -20px rgba(0,0,0,.6);transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform var(--spring-dur) var(--spring),opacity .25s}
.layer.open .dialog{transform:translate(-50%,-50%);opacity:1}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog p{color:var(--text2);font-size:14.5px;margin-bottom:18px}
.dialog .btn-row .btn{flex:1}

/* ---------- Account edit mode ---------- */
.car-slot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.acc-j{position:relative;will-change:transform,opacity}
.acc-w{position:relative;transform-origin:50% 60%}
.editing .acc-w{animation:jiggle var(--jd,.26s) ease-in-out var(--jdel,0s) infinite alternate}
@keyframes jiggle{from{transform:rotate(calc(var(--jr,1.1deg) * -1))}to{transform:rotate(var(--jr,1.1deg))}}
.car-slot.lifted{position:relative;z-index:5}
.car-slot.lifted .acc-w{animation:none;transform:scale(1.06);transition:transform .35s var(--spring)}
.car-slot.lifted .acc{box-shadow:var(--hl), 0 34px 50px -18px rgba(0,0,0,.85)}
.acc-del{position:absolute;z-index:3;top:-9px;right:-5px;width:30px;height:30px;border-radius:15px;display:grid;place-items:center;
  background:var(--bar-bg);border:1px solid var(--border-2);color:var(--text);box-shadow:var(--hl), 0 6px 16px -4px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  transform:scale(0);opacity:0;pointer-events:none;transition:transform .45s var(--spring), opacity .2s}
.acc-del::before{content:"";position:absolute;inset:-9px}
.acc-del .ic{width:16px;height:16px;stroke-width:3}
.editing .acc-del{transform:scale(1);opacity:1;pointer-events:auto}
.acc-add{width:100%;height:184px;border-radius:28px;border:1.5px dashed var(--border-2);background:rgba(255,255,255,.025);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text2);font-weight:600;font-size:15px}
:root[data-theme="light"] .acc-add{background:rgba(255,255,255,.35)}
.acc-add .plus{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:var(--field);border:1px solid var(--border);box-shadow:var(--hl)}
.edit-hint{text-align:center;font-size:12px;color:var(--text3);max-height:0;opacity:0;overflow:hidden;transition:opacity .3s}
.editing .edit-hint{max-height:40px;opacity:1;margin-top:4px}
.edit-done{position:fixed;z-index:45;top:calc(env(safe-area-inset-top) + 18px);right:16px;height:42px;padding:0 24px;border-radius:21px;
  font-weight:700;font-size:15px;color:var(--text);background:var(--bar-bg);border:1px solid var(--border-2);box-shadow:var(--hl),0 12px 30px -10px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  transform:translateY(-90px);transition:transform var(--spring-dur) var(--spring)}
.edit-done.show{transform:none}
.car-editing .dash-head .icon-btn{opacity:0;pointer-events:none;transition:opacity .2s}
@media (min-width: 960px){ .edit-done{top:28px;right:max(32px, calc(100% - 268px - 1120px + 32px))} }
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-grid .chip{justify-content:flex-start}
.type-note{display:block;font-size:12px;color:var(--text3);padding:0 6px}
.type-note:empty{display:none}
.acc-prev{height:164px;pointer-events:none}
.btn.danger-o{color:var(--danger);border-color:rgba(255,138,128,.45);background:rgba(255,138,128,.07)}
.btn.danger-fill{background:#d4483b;color:#fff;border:0;box-shadow:0 10px 24px -12px rgba(212,72,59,.8)}
.rec-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:rgba(10,12,38,.16)}
.del-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:24px;border:1px solid var(--border);box-shadow:var(--hl);
  background:radial-gradient(120% 90% at 100% 0%, var(--ca), transparent 60%), linear-gradient(160deg,var(--g1),var(--g2))}
.del-bal{font-size:18px}
.del-note{font-size:14px;color:var(--text2);padding:0 4px}
.del-foot{display:grid;gap:8px}
.del-help{font-size:12.5px;color:var(--text3);padding:0 6px 4px}
.del-confirm{display:grid;gap:4px;padding:14px 16px;border-radius:18px;background:rgba(255,138,128,.1);border:1px solid rgba(255,138,128,.32);font-size:14px}
.del-confirm b{color:var(--danger);font-size:17px}
/* sheet growing out of a card */
.morph-src{opacity:0 !important;transition:none !important}
.layer.morph .sheet > :not(.skin){position:relative}
.skin{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.skin-p{background:var(--panel-2);border:1px solid var(--border);border-bottom:0;box-shadow:var(--hl), 0 -20px 50px -20px rgba(0,0,0,.6);opacity:0;transition:opacity .22s ease}
.skin-a{opacity:1;transition:opacity .34s ease .1s}
.layer.morph .sheet{background:transparent;border-color:transparent;box-shadow:none}
.layer.morph .sheet > :not(.skin){opacity:0;transition:opacity .2s ease}
.layer.morph-in .skin-p{opacity:1}
.layer.morph-in .skin-a{opacity:0}
.layer.morph-in .sheet > :not(.skin){opacity:1;transition:opacity .3s ease .16s}
.layer.morph-out .skin-p{opacity:1}
.layer.morph-out .skin-a{opacity:1;transition:opacity .24s ease .1s}
.layer.morph-out .sheet > :not(.skin){opacity:0;transition:opacity .14s ease}
@media (min-width: 700px){ .skin-p{border-bottom:1px solid var(--border)} }
@media (prefers-reduced-motion: reduce){ .editing .acc-w{animation:none !important} }

/* ---------- Motion ---------- */
.page-in{animation:pageIn .5s var(--ease-out) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.entering .rise{animation:rise .75s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--ease-out) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0}}
.press{transition:transform .45s var(--spring)}
.press:active{transform:scale(.975)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0s !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .draw{stroke-dashoffset:0}
}

// Generate a real spring curve as CSS linear() easing
(function setupSpring() {
  const ok = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  if (!ok) return;
  const make = (k, c) => {
    let x = 0, v = 0; const dt = 1 / 240; const pts = [];
    for (let i = 0; i < 2400; i++) {
      const a = -k * (x - 1) - c * v; v += a * dt; x += v * dt; pts.push(x);
      if (i > 60 && Math.abs(x - 1) < .0008 && Math.abs(v) < .01) break;
    }
    const n = 48; const out = [];
    for (let i = 0; i <= n; i++) out.push(+pts[Math.min(pts.length - 1, Math.round(i / n * (pts.length - 1)))].toFixed(4));
    out[n] = 1;
    return { css: `linear(${out.join(', ')})`, ms: Math.round(pts.length * dt * 1000) };
  };
  const s = make(210, 21);
  document.documentElement.style.setProperty('--spring', s.css);
  document.documentElement.style.setProperty('--spring-dur', s.ms + 'ms');
})();

const easeOut = t => 1 - Math.pow(1 - t, 3);
function tween(dur, onFrame, done) {
  if (reduced()) { onFrame(1); done && done(); return () => { }; }
  const t0 = performance.now(); let raf, stop = false;
  const f = now => { if (stop) return; const p = clamp((now - t0) / dur, 0, 1); onFrame(easeOut(p)); if (p < 1) raf = requestAnimationFrame(f); else done && done(); };
  raf = requestAnimationFrame(f);
  return () => { stop = true; cancelAnimationFrame(raf); };
}

}
function runCounters(root, fromZero) {

}

/* ---------- Layers ---------- */
function lockBody() { document.body.classList.toggle('locked', !!$('#layers').children.length); }

// Drag-down-to-close for a panel. scroller: element whose scrollTop gates dragging.
function attachSwipeDown(panel, handleEls, scroller, onClose, onProgress) {
  let y0 = 0, dy = 0, t0 = 0, dragging = false, startOk = false;
  const begin = (y, fromHandle) => { y0 = y; dy = 0; t0 = performance.now(); startOk = fromHandle || !scroller || scroller.scrollTop <= 0; dragging = false; };
  const move = (y, e) => {
    if (!startOk) return;
    const d = y - y0;
    if (!dragging) { if (d > 6) { dragging = true; panel.classList.add('dragging'); } else if (d < -4) { startOk = false; return; } else return; }
    dy = Math.max(0, d); if (e.cancelable) e.preventDefault();
    panel.style.transform = `translateY(${dy}px)`; onProgress && onProgress(dy);
  };
  const end = () => {
    if (!dragging) { startOk = false; return; }
    dragging = false; startOk = false; panel.classList.remove('dragging');
    const v = dy / Math.max(1, performance.now() - t0);
    if (dy > 110 || (v > .55 && dy > 30)) onClose(dy);
    else { panel.style.transform = ''; onProgress && onProgress(0); }
  };
  panel.addEventListener('touchstart', e => begin(e.touches[0].clientY, handleEls.some(h => h.contains(e.target))), { passive: true });
  panel.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  panel.addEventListener('touchend', end); panel.addEventListener('touchcancel', end);
  // Mouse: only from the handle
  handleEls.forEach(h => h.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    begin(e.clientY, true);
    const mm = ev => move(ev.clientY, ev); const mu = () => { end(); window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', mu); };
    window.addEventListener('pointermove', mm); window.addEventListener('pointerup', mu);
  }));
}

// from: an element (e.g. an account card) the sheet grows out of and, on cancel, shrinks back into
function openSheet({ title, body, onMount, onClose, cls = '', from = null }) {
  const layer = document.createElement('div'); layer.className = 'layer';
  layer.innerHTML = `<div class="backdrop"></div>
    <section class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"><i></i></div>
      <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Bezárás">${icon('x')}</button></div>
      <div class="sheet-b">${body}</div>
    </section>`;
  const sheet = $('.sheet', layer), bd = $('.backdrop', layer), sb = $('.sheet-b', layer);
  const visible = el => !!el && el.isConnected && el.getBoundingClientRect().width > 0;
  const morph = !reduced() && visible(from);
  let radius = 28;
  if (morph) { // start state is set before the sheet is ever styled, so its content fades in from 0
    layer.classList.add('morph');
    sheet.insertAdjacentHTML('afterbegin', '<div class="skin skin-p"></div><div class="skin skin-a"></div>');
    const cs = getComputedStyle(from), sa = $('.skin-a', sheet);
    sa.style.backgroundImage = cs.backgroundImage; sa.style.backgroundColor = cs.backgroundColor;
    sa.style.border = `${cs.borderTopWidth} ${cs.borderTopStyle} ${cs.borderTopColor}`;
    radius = parseFloat(cs.borderTopLeftRadius) || 28;
    sheet.style.transition = 'none';
  }
  $('#layers').append(layer); lockBody();
  const toSource = () => {
    const r = from.getBoundingClientRect();
    const sx = r.width / sheet.offsetWidth, sy = r.height / sheet.offsetHeight;
    $('.skin-a', sheet).style.borderRadius = `${(radius / sx).toFixed(1)}px / ${(radius / sy).toFixed(1)}px`;
    return `translate(${(r.left - sheet.offsetLeft).toFixed(1)}px, ${(r.top - sheet.offsetTop).toFixed(1)}px) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
  };
  let closed = false;
  const api = {
    el: sheet, layer, morph,
    // opts.plain: close by sliding down even if the sheet morphed open (used after saving)
    close(fromDy, opts = {}) {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey);
      const done = () => { if (from) from.classList.remove('morph-src'); layer.remove(); lockBody(); onClose && onClose(); };
      if (morph && !opts.plain && !reduced() && visible(from)) {
        layer.classList.remove('open', 'morph-in'); layer.classList.add('morph-out');
        sheet.classList.remove('dragging');
        sheet.style.transformOrigin = '0 0';
        sheet.style.transition = 'transform .44s cubic-bezier(.3,.9,.25,1)';
        sheet.style.transform = toSource();
        setTimeout(done, 430);
        return;
      }
      if (from) from.classList.remove('morph-src');
      sheet.style.transition = ''; sheet.style.transformOrigin = ''; layer.classList.remove('open');
      sheet.style.transform = '';
      if (fromDy) { sheet.style.transform = `translateY(${fromDy}px)`; requestAnimationFrame(() => { sheet.style.transform = ''; }); }
      reduced() ? done() : setTimeout(done, 380);
    }
  };
  const onKey = e => { if (e.key === 'Escape') api.close(); };
  document.addEventListener('keydown', onKey);
  bd.onclick = () => api.close();
  $('[data-close]', layer).onclick = () => api.close();
  attachSwipeDown(sheet, [$('.grab', layer), $('.sheet-h', layer)], sb, dy => api.close(dy), dy => { bd.style.opacity = String(clamp(1 - dy / 400, .2, 1)); });
  onMount && onMount(sheet, api);
  if (morph) {
    sheet.style.transformOrigin = '0 0';
    sheet.style.transform = toSource();
    from.classList.add('morph-src');
    sheet.getBoundingClientRect();
    requestAnimationFrame(() => {
      sheet.style.transition = 'transform var(--spring-dur) var(--spring)';
      sheet.style.transform = 'none';
      layer.classList.add('open', 'morph-in');
    });
  } else {
    sheet.getBoundingClientRect();
    requestAnimationFrame(() => layer.classList.add('open'));
  }
  return api;
}

}

/* ---------- Card → detail expansion (FLIP on transform) ---------- */
let detailApi = null;
function openDetail(src, { title, body, onMount, actions = '' }) {
  if (detailApi) detailApi.close(true);
  const layer = document.createElement('div'); layer.className = 'layer detail-layer';
  layer.innerHTML = `<div class="backdrop"></div>
    <section class="detail" role="dialog" aria-modal="true" aria-label="${esc(title)}">

      </div>

  $('#layers').append(layer); lockBody();
  const panel = $('.detail', layer), bg = $('.detail-bg', layer), content = $('.detail-content', layer), bd = $('.backdrop', layer);
  const fromRect = () => {
    if (!src || !src.isConnected) return null;
    const r = src.getBoundingClientRect(), p = bg.getBoundingClientRect();
    if (!r.width || !p.width) return null;
    return `translate(${r.left - p.left}px, ${r.top - p.top}px) scale(${r.width / p.width}, ${r.height / p.height})`;
  };
  const start = fromRect();
  if (start && !reduced()) {
    bg.style.transform = start; bg.style.opacity = '.4';
    src.style.transition = 'opacity .2s'; src.style.opacity = '0';
    bg.getBoundingClientRect();
    requestAnimationFrame(() => {
      bg.style.transition = `transform var(--spring-dur) var(--spring), opacity .25s ease`;
      bg.style.transform = 'none'; bg.style.opacity = '1';
      layer.classList.add('open');
      setTimeout(() => panel.classList.add('shown'), 120);
    });
  } else { layer.classList.add('open'); panel.classList.add('shown'); }
  let closed = false;
  const api = detailApi = {
    layer, panel,
    close(instant, dy) {
      if (closed) return; closed = true; detailApi = null;
      document.removeEventListener('keydown', onKey);
      const fin = () => { layer.remove(); lockBody(); if (src) { src.style.opacity = ''; setTimeout(() => src && (src.style.transition = ''), 250); } };
      if (instant || reduced()) return fin();
      panel.classList.remove('shown'); layer.classList.remove('open');
      const back = dy ? null : fromRect();
      if (back) {
        panel.style.transform = '';
        bg.style.transition = `transform .42s var(--ease-out), opacity .4s ease`;
        bg.style.transform = back; bg.style.opacity = '.35';
        setTimeout(() => { if (src) src.style.opacity = ''; }, 260);
        setTimeout(fin, 430);
      } else {
        panel.style.transition = 'transform .35s var(--ease-out), opacity .3s'; panel.style.transform = `translateY(${(dy || 0) + 140}px)`; panel.style.opacity = '0';
        setTimeout(fin, 340);
      }
    }
  };
  const onKey = e => { if (e.key === 'Escape') api.close(); };
  document.addEventListener('keydown', onKey);
  $('[data-close]', layer).onclick = () => api.close();
  bd.onclick = () => api.close();
  attachSwipeDown(panel, [$('.detail-h', layer)], $('.detail-s', layer), dy => api.close(false, dy), dy => { bd.style.opacity = String(clamp(1 - dy / 400, .2, 1)); });
  onMount && onMount($('.detail-s', layer), api);
  return api;
}

/* ---------- Segmented control ---------- */
function segHTML(name, opts, val) {
  const i = Math.max(0, opts.findIndex(o => o[0] === val));
  return `<div class="seg" data-seg="${name}" role="tablist" style="--n:${opts.length}">
    <span class="thumb" style="width:calc((100% - 8px)/${opts.length});transform:translateX(${i * 100}%)"></span>
    ${opts.map(o => `<button role="tab" data-v="${o[0]}" class="${o[0] === val ? 'on' : ''}" aria-selected="${o[0] === val}">${o[1]}</button>`).join('')}</div>`;
}
function bindSeg(root, name, cb) {
  const seg = $(`[data-seg="${name}"]`, root); if (!seg) return;
  const btns = $$('button', seg), th = $('.thumb', seg);
  btns.forEach((b, i) => b.onclick = () => {
    btns.forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    th.style.transform = `translateX(${i * 100}%)`;
    cb(b.dataset.v);
  });
}

function buildNav() {

function go(p) { if (location.hash !== '#/' + p) location.hash = '#/' + p; else renderPage(true); }

document.addEventListener('click', e => {

/* ---------------- Dashboard ---------------- */
// Carousel order = order of active accounts in S.accounts, with "All bank cards" fixed in position 2
function carItems(key) {
  const asOf = minD(monthEnd(key), today());
  const active = activeAccounts();
  const cards = active.filter(a => a.type === 'card');
  const single = a => ({ id: a.id, name: a.name, ids: [a.id], cur: a.currency, bal: balance(a.id, asOf), balHUF: balanceHUF(a.id, asOf), icon: accIcon(a), slot: a.slot, kind: a.currency, account: a, list: [a] });
  const all = { id: 'g_cards', name: 'Összes bankkártya', ids: cards.map(a => a.id), cur: 'HUF', bal: sum(cards, a => balanceHUF(a.id, asOf)), icon: 'wallet', slot: 7, kind: `${cards.length} kártya`, list: cards, group: true };
  const items = active.map(single);
  items.splice(Math.min(1, items.length), 0, all);
  return items;
}
function carCardHTML(it, key) {
  const f = accountMonthFlow(it.ids, key);
  let sub = '';
  if (it.id === 'g_cards') sub = `<div class="acc-chips">${it.list.map(a => `<i style="--c:${tintColor(a.slot)}"></i>`).join('')}</div>`;
  const conv = it.cur !== 'HUF' ? `<span>≈ <b>${money(it.balHUF)}</b></span>` : '';
  return `<div class="acc" style="--ca:${hexA(slotColor(it.slot), themeMode() === 'light' ? .22 : .42)}">
    <div class="acc-top">${`<span class="cico" style="${cVars(it.slot)}">${icon(it.icon)}</span>`}<span>${esc(it.name)}</span><span class="acc-kind">${esc(it.kind)}</span></div>
    ${sub}
    <div class="acc-bal">${numEl('acc_' + it.id, it.bal, it.cur)}</div>
    <div class="acc-sub">${conv}<span class="inc">↑ ${money(f.inn)}</span><span>↓ ${money(f.out)}</span></div>
  </div>`;
}
function carSlotHTML(it, key, canDelete) {
  const del = it.account && canDelete ? `<button class="acc-del" data-del="${it.id}" aria-label="${esc(it.name)} eltávolítása">${icon('minus')}</button>` : '';
  return `<div class="car-slot" data-id="${it.id}" role="group" aria-label="${esc(it.name)}"><div class="acc-j"><div class="acc-w">${carCardHTML(it, key)}${del}</div></div></div>`;
}
function newSlotHTML() {
  return `<div class="car-slot car-new" data-new="1" role="group" aria-label="Új számla"><div class="acc-j"><div class="acc-w"><button class="acc-add" aria-label="Új számla hozzáadása"><span class="plus">${icon('plus')}</span><span>Új számla</span></button></div></div></div>`;
}
RENDER.dashboard = (root, enter) => {

  if (!UI.month || !months.includes(UI.month)) UI.month = curMonth();
  root.innerHTML = `
    <header class="dash-head rise" style="--i:0">

UPDATE.dashboard = () => dashFill(false);

function dashFill(enter) {
  const key = UI.month;
  const items = carItems(key);
  const car = $('#car');
  const canDel = activeAccounts().length > 1;
  car.innerHTML = `<div class="car-pad"></div>` + items.map(it => carSlotHTML(it, key, canDel)).join('') + newSlotHTML() + `<div class="car-pad"></div>`;
  if (UI.carIdx == null || UI.carIdx > items.length) UI.carIdx = items.findIndex(x => x.id === 'g_cards');
  setupCarousel();
  applyEditClass();
  if (UI.focusAcc) focusNewAccount(UI.focusAcc);

const carSlots = (car = $('#car')) => car ? $$('.car-slot', car) : [];
function setupCarousel() {
  const car = $('#car'), dots = $('#dots');
  const slots = carSlots(car);
  dots.innerHTML = slots.map(s => `<button aria-label="${esc(s.getAttribute('aria-label'))}"></button>`).join('');
  const offsetFor = i => { const s = carSlots(car)[i]; return s ? s.offsetLeft - (car.clientWidth - s.offsetWidth) / 2 : 0; };
  const update = () => {
    if (!car.isConnected) return;
    const ss = carSlots(car), dd = [...dots.children];
    const cx = car.scrollLeft + car.clientWidth / 2; let best = 0, bd = 1e9;
    ss.forEach((s, i) => {
      const d = (s.offsetLeft + s.offsetWidth / 2 - cx) / s.offsetWidth; const t = Math.min(Math.abs(d), 1);
      const c = s.firstElementChild, lifted = s.classList.contains('lifted');
      c.style.transform = `scale(${lifted ? 1 : 1 - .13 * t})`;
      c.style.opacity = String(lifted ? 1 : 1 - .45 * t);
      if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
    });
    UI.carIdx = best;
    dd.forEach((d, i) => d.classList.toggle('on', i === best));
  };
  const toIdx = i => car.scrollTo({ left: offsetFor(i), behavior: reduced() ? 'auto' : 'smooth' });
  if (!car._bound) {
    car._bound = true;
    let raf = 0; car.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; car._update && car._update(); }); }, { passive: true });
    // mouse drag for desktop
    let x0 = 0, s0 = 0, down = false;
    car.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; car._moved = false; x0 = e.clientX; s0 = car.scrollLeft; });
    window.addEventListener('pointermove', e => { if (!down || !car.isConnected) return; if (car._picked) { down = false; return; } const dx = e.clientX - x0; if (Math.abs(dx) > 4) { car._moved = true; car.classList.add('drag'); } car.scrollLeft = s0 - dx; });
    window.addEventListener('pointerup', () => { if (!down) return; down = false; if (car._moved) { car.classList.remove('drag'); car._toIdx && car._toIdx(UI.carIdx); } });
    let lastW = car.clientWidth;
    window.addEventListener('resize', () => {
      if (!car.isConnected) return;
      if (car.clientWidth !== lastW) { lastW = car.clientWidth; car.scrollLeft = car._offsetFor(UI.carIdx); }
      car._update();
    });
    bindCarEdit(car);
    car.addEventListener('contextmenu', e => { if (e.target.closest('.car-slot')) e.preventDefault(); });
    car.addEventListener('click', e => {
      if (car._suppress) { car._suppress = false; return; }
      if (car._moved) { car._moved = false; return; }
      const del = e.target.closest('[data-del]');
      if (del) { if (UI.editing) openDeleteAccount(acc(del.dataset.del)); return; }
      const slot = e.target.closest('.car-slot'); if (!slot) return;
      if (slot.dataset.new) { openAccountSheet(null, $('.acc-add', slot)); return; }
      if (UI.editing) {
        if (slot.dataset.id === 'g_cards') { shake($('.acc', slot)); toast('Ez egy számított összeg – nem szerkeszthető.'); return; }
        openAccountSheet(acc(slot.dataset.id), $('.acc', slot)); return;
      }
      const i = carSlots(car).indexOf(slot);
      if (i !== UI.carIdx) { car._toIdx(i); return; }
      const it = carItems(UI.month).find(x => x.id === slot.dataset.id);
      if (it) openAccDetail(it, $('.acc', slot));
    });
  }
  car._update = update; car._toIdx = toIdx; car._offsetFor = offsetFor;
  car.scrollLeft = offsetFor(clamp(UI.carIdx, 0, slots.length - 1));
  update();
  [...dots.children].forEach((d, i) => d.onclick = () => toIdx(i));
}

/* ---- Account edit mode: long press → jiggle, minus badges, drag to reorder ---- */
function suppressCarClick(car) { car._suppress = true; clearTimeout(car._supT); car._supT = setTimeout(() => { car._suppress = false; }, 450); }
function applyEditClass() {
  const w = $('#carWrap'); if (!w) return;
  w.classList.toggle('editing', !!UI.editing);
  if (UI.editing) $$('.acc-w', w).forEach(el => {
    el.style.setProperty('--jd', (.24 + Math.random() * .09).toFixed(3) + 's');
    el.style.setProperty('--jdel', (-Math.random() * .3).toFixed(3) + 's');
    el.style.setProperty('--jr', (.9 + Math.random() * .5).toFixed(2) + 'deg');
  });
}
function enterEdit() {
  if (UI.editing || route !== 'dashboard') return;
  UI.editing = true;
  document.body.classList.add('car-editing');
  haptic(15);
  applyEditClass();
  let b = $('#editDone');
  if (!b) { b = document.createElement('button'); b.id = 'editDone'; b.className = 'edit-done'; b.textContent = 'Kész'; b.onclick = () => exitEdit(); document.body.append(b); }
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('show')));
  try { history.pushState({ prismEdit: 1 }, ''); } catch (_) { /* ignore */ }
}
function exitEdit(opts = {}) {
  if (!UI.editing) return;
  UI.editing = false;
  document.body.classList.remove('car-editing');
  const w = $('#carWrap');
  if (w) {
    // settle each card smoothly from wherever its wobble currently is
    const ws = $$('.acc-w', w); const mats = ws.map(el => getComputedStyle(el).transform);
    w.classList.remove('editing');
    if (!reduced()) ws.forEach((el, i) => { if (mats[i] && mats[i] !== 'none') el.animate([{ transform: mats[i] }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,1.3,.4,1)' }); });
  }
  const b = $('#editDone'); if (b) { b.classList.remove('show'); setTimeout(() => b.remove(), 400); }
  if (!opts.fromPop && !opts.silent && history.state && history.state.prismEdit) history.back();
}
window.addEventListener('popstate', () => { if (UI.editing) exitEdit({ fromPop: true }); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.editing && !$('#layers').children.length) exitEdit(); });
// Tapping empty space ends edit mode (and does nothing else); navigation still works
document.addEventListener('click', e => {
  if (!UI.editing) return;
  const t = e.target;
  if (t.closest('.car-slot, #editDone, .layer, #toasts, .dots')) return;
  exitEdit();
  if (t.closest('.tabbar, .sidebar, .fab')) return;
  e.preventDefault(); e.stopPropagation();
}, true);

function bindCarEdit(car) {
  let st = null, raf = 0;
  const accSlots = () => carSlots(car).filter(s => s.dataset.id && s.dataset.id !== 'g_cards');
  const cancel = () => { if (st) clearTimeout(st.timer); st = null; };
  const begin = (target, x, y) => {
    if (target.closest('.acc-del')) return;
    const slot = target.closest('.car-slot'); if (!slot) return;
    cancel();
    st = { slot, x0: x, y0: y, x, y, picked: false, moved: false, tx: 0 };
    const draggable = !!slot.dataset.id && slot.dataset.id !== 'g_cards';
    st.timer = setTimeout(() => {
      if (!st) return;
      if (!UI.editing) { enterEdit(); suppressCarClick(car); }
      if (draggable && UI.editing) pickUp();
    }, UI.editing ? 220 : 500);
  };
  const place = () => {
    st.tx = st.x - st.x0 + (car.scrollLeft - st.scroll0) - (st.slot.offsetLeft - st.left0);
    st.slot.style.transform = `translateX(${st.tx.toFixed(1)}px)`;
  };
  const reorder = () => {
    const list = accSlots();
    const cx = st.slot.offsetLeft + st.slot.offsetWidth / 2 + st.tx;
    const others = list.filter(s => s !== st.slot);
    const idx = others.filter(s => s.offsetLeft + s.offsetWidth / 2 < cx).length;
    if (idx === list.indexOf(st.slot)) return;
    const order = others.map(s => s.dataset.id); order.splice(idx, 0, st.slot.dataset.id);
    applyCarOrder(car, order, st.slot);
    place();
  };
  const loop = () => {
    if (!st || !st.picked) return;
    const r = car.getBoundingClientRect(), edge = 44;
    const v = st.x < r.left + edge ? -9 : st.x > r.right - edge ? 9 : 0;
    if (v) { car.scrollLeft += v; place(); reorder(); }
    raf = requestAnimationFrame(loop);
  };
  const pickUp = () => {
    st.picked = true; car._picked = true;
    st.scroll0 = car.scrollLeft; st.left0 = st.slot.offsetLeft;
    st.slot.classList.add('lifted'); car.classList.add('drag'); car._update();
    loop();
  };
  const move = (x, y, e) => {
    if (!st) return;
    st.x = x; st.y = y;
    if (!st.picked) { if (Math.hypot(x - st.x0, y - st.y0) > 8) cancel(); return; } // a swipe: let the carousel scroll
    if (e && e.cancelable) e.preventDefault();
    st.moved = true; place(); reorder();
  };
  const end = () => {
    if (!st) return;
    const s = st; st = null; clearTimeout(s.timer); cancelAnimationFrame(raf);
    if (!s.picked) return;
    car._picked = false; car.classList.remove('drag'); s.slot.classList.remove('lifted');
    const from = s.slot.style.transform; s.slot.style.transform = '';
    if (from && !reduced()) s.slot.animate([{ transform: from }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,1.1,.3,1)' });
    suppressCarClick(car);
    if (s.moved) saveCarOrder(car);
    const i = carSlots(car).indexOf(s.slot); if (i >= 0) car._toIdx(i);
  };
  car.addEventListener('touchstart', e => { if (e.touches.length === 1) begin(e.target, e.touches[0].clientX, e.touches[0].clientY); else cancel(); }, { passive: true });
  car.addEventListener('touchmove', e => { if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
  car.addEventListener('touchend', end); car.addEventListener('touchcancel', end);
  car.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0) begin(e.target, e.clientX, e.clientY); });
  window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && st) move(e.clientX, e.clientY, e); });
  window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
}
// Reorder the carousel DOM to `order` (account ids); "All bank cards" stays 2nd, "+ Új számla" last.
// The other cards slide to their new places (FLIP, transform only).
function applyCarOrder(car, order, dragged) {
  const all = carSlots(car);
  const byId = new Map(all.map(s => [s.dataset.id || 'new', s]));
  const before = new Map(all.map(s => [s, s.offsetLeft]));
  const seq = order.map(id => byId.get(id)).filter(Boolean);
  if (byId.get('g_cards')) seq.splice(Math.min(1, seq.length), 0, byId.get('g_cards'));
  if (byId.get('new')) seq.push(byId.get('new'));
  const endPad = car.lastElementChild;
  seq.forEach(s => car.insertBefore(s, endPad));
  if (reduced()) return;
  seq.forEach(s => {
    if (s === dragged) return;
    const d = before.get(s) - s.offsetLeft;
    if (Math.abs(d) > .5) s.animate([{ transform: `translateX(${d}px)` }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,1,.3,1)' });
  });
}
function saveCarOrder(car) {
  const ids = carSlots(car).map(s => s.dataset.id).filter(id => id && id !== 'g_cards');
  const moved = ids.map(acc).filter(Boolean);
  S.accounts = [...moved, ...S.accounts.filter(a => !ids.includes(a.id))];
  save();
  const dots = $('#dots'); if (dots) carSlots(car).forEach((s, i) => dots.children[i] && dots.children[i].setAttribute('aria-label', s.getAttribute('aria-label')));
}
// Card collapses out of the carousel; the others slide together (transform/opacity only)
function collapseSlot(id, done) {
  const car = $('#car'); const slot = car && car.querySelector(`.car-slot[data-id="${id}"]`);
  if (!slot || reduced()) { done(); return; }
  const others = carSlots(car).filter(s => s !== slot);
  const before = new Map(others.map(s => [s, s.getBoundingClientRect().left]));
  const a = slot.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.55)', opacity: 0 }], { duration: 260, easing: 'cubic-bezier(.4,0,.7,1)', fill: 'forwards' });
  a.onfinish = () => {
    slot.remove();
    others.forEach(s => { const d = before.get(s) - s.getBoundingClientRect().left; if (Math.abs(d) > .5) s.animate([{ transform: `translateX(${d}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,1,.3,1)' }); });
    car._update && car._update();
    setTimeout(done, 430);
  };
}
// After adding/restoring: the new card slides in and the carousel scrolls to it
function focusNewAccount(id) {
  UI.focusAcc = null;
  const car = $('#car'); const ss = carSlots(car); const i = ss.findIndex(s => s.dataset.id === id);
  if (i < 0) return;
  if (!reduced()) $('.acc-j', ss[i]).animate([{ opacity: 0, transform: 'translateY(16px) scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.2,1.2,.3,1)' });
  setTimeout(() => car._toIdx(i), 60);
}

/* ---- Removing an account: archive (recommended) or delete with transactions ---- */
function openDeleteAccount(a) {
  if (!a) return;
  const active = activeAccounts();
  if (active.length <= 1) { toast('Az utolsó számla nem távolítható el.'); return; }
  const txs = S.transactions.filter(t => t.accountId === a.id || t.toAccountId === a.id);
  const recs = S.recurring.filter(r => r.accountId === a.id && r.status !== 'cancelled');
  const others = active.filter(x => x.id !== a.id);
  let target = recs.length ? (others.find(x => x.currency === a.currency && x.type === a.type) || others.find(x => x.currency === a.currency) || others[0]).id : null;
  const bal = balance(a.id);
  openSheet({
    title: 'Számla eltávolítása',
    body: `
      <div class="del-card" style="--ca:${hexA(slotColor(a.slot), themeMode() === 'light' ? .22 : .42)}">
        <span class="cico" style="${cVars(a.slot)}">${icon(accIcon(a))}</span>
        <div class="row-m"><div class="row-t">${esc(a.name)}</div><div class="row-s">${ACC_TYPES[a.type] || ''} · ${a.currency}</div></div>
        <div class="row-a del-bal">${money(bal, a.currency)}${a.currency !== 'HUF' ? `<small>≈ ${money(balanceHUF(a.id))}</small>` : ''}</div>
      </div>
      <p class="del-note">${txs.length ? `${txs.length} tétel tartozik ehhez a számlához.` : 'Ehhez a számlához még nem tartozik tétel.'}</p>
      ${recs.length ? `<div class="field"><span>${recs.length} ismétlődő tétel használja ezt a számlát (${esc(recs.map(r => r.name).join(', '))}). Hová kerüljenek?</span><div class="hscroll" id="dRec"></div></div>` : ''}
      <div class="del-foot" id="dFoot"></div>`,
    onMount(sh, api) {
      const drawRec = () => {
        const box = $('#dRec', sh); if (!box) return;
        box.innerHTML = others.map(x => `<button class="chip ${target === x.id ? 'on' : ''}" data-rt="${x.id}" style="--c:${tintColor(x.slot)}"><span class="cico" style="${cVars(x.slot)}">${icon(accIcon(x))}</span>${esc(x.name)}</button>`).join('')
          + `<button class="chip plain ${target === 'pause' ? 'on' : ''}" data-rt="pause">${icon('pause')}Szüneteltetés</button>`;
      };
      const foot = $('#dFoot', sh);
      const finish = mode => { api.close(undefined, { plain: true }); removeAccount(a, mode, target); };

function removeAccount(a, mode, target) {

  const fallback = activeAccounts().find(x => x.id !== a.id)?.id;
  S.recurring.forEach(r => {
    if (r.accountId !== a.id) return;

    if (r.status === 'active') { r.status = 'paused'; r.pausedAt = today(); }

  });
  if (mode === 'archive') { a.archived = true; a.archivedAt = today(); }
  else {

}

}

/* ---- Sparkline (single series, no legend) ---- */
function drawSpark(svg, data, enter) {
  if (!svg) return;
  const w = svg.clientWidth || 140, h = 64, padT = 8, padB = 14, padX = 5;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const vals = data.map(d => d.v); const max = Math.max(...vals, 1), min = Math.min(...vals, 0) * 0;
  const x = i => data.length === 1 ? w / 2 : padX + i * (w - padX * 2) / (data.length - 1);
  const y = v => padT + (1 - (v - min) / (max - min || 1)) * (h - padT - padB);
  const pts = data.map((d, i) => [x(i), y(d.v)]);
  if (pts.length === 1) pts.unshift([padX, pts[0][1]]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length - 1][0]} ${h - padB} L ${pts[0][0]} ${h - padB} Z`;
  const last = pts[pts.length - 1];
  const col = getComputedStyle(document.documentElement).getPropertyValue('--income').trim();
  const len = pts.reduce((a, p, i) => i ? a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0, 0);
  svg.innerHTML = `<path d="${area}" fill="${col}" opacity=".12" class="${enter ? 'fade-in' : ''}"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${enter && !reduced() ? `class="draw" style="--len:${len.toFixed(1)}"` : ''}/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${col}" stroke="var(--row-solid)" stroke-width="2" class="${enter ? 'fade-in' : ''}"/>
    ${data.length > 1 ? `<text x="${padX}" y="${h - 1}" font-size="10" fill="currentColor" opacity=".7">${mShort(data[0].k)}</text><text x="${w - padX}" y="${h - 1}" font-size="10" text-anchor="end" fill="currentColor" opacity=".7">${mShort(data[data.length - 1].k)}</text>` : ''}`;
  svg.style.color = 'var(--text3)';
}

/* ---- Ring chart with morph ---- */
let RING_PREV = {};
function drawRing(svg, data, enter) {
  if (!svg) return;
  const r = 26, C = 2 * Math.PI * r, gap = data.segs.length > 1 ? 2.2 : 0;
  const tgt = {}; data.segs.forEach(s => tgt[s.id] = data.total ? s.v / data.total : 0);
  const from = enter ? {} : RING_PREV;
  const ids = data.segs.map(s => s.id);
  const render = p => {
    let off = 0, out = `<circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--tile)" stroke-width="9"/>`;
    const fr = ids.map(id => (from[id] ?? 0) + (tgt[id] - (from[id] ?? 0)) * p);
    ids.forEach((id, i) => {
      const L = fr[i] * C; const seg = data.segs[i];
      if (L > gap) out += `<circle cx="33" cy="33" r="${r}" fill="none" stroke="${slotColor(seg.c.slot)}" stroke-width="9" stroke-dasharray="${(L - gap).toFixed(2)} ${(C - L + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 33 33)"/>`;
      off += L;
    });
    svg.innerHTML = out;
  };
  RING_PREV = tgt;
  tween(enter ? 1000 : 650, render);
}

const HF = { q: '', range: 'month', from: null, to: null, acc: 'all', cat: 'all', type: 'all' };

function rangeBounds(r) {
  const t = today(), cm = curMonth();
  if (r.startsWith('month-')) { const k = r.slice(6); return [monthStart(k), monthEnd(k)]; }
  switch (r) {
    case 'week': { const w = weekStart(t); return [w, addDays(w, 6)]; }
    case 'month': return [monthStart(cm), monthEnd(cm)];
    case 'prev': { const k = addMonths(cm, -1); return [monthStart(k), monthEnd(k)]; }
    case '3m': return [monthStart(addMonths(cm, -2)), monthEnd(cm)];
    case 'planned': return [addDays(t, 1), '9999-12-31'];
    case 'custom': return [HF.from || '0000-01-01', HF.to || '9999-12-31'];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
function rangeOptions() {
  const cm = curMonth();
  if (HF.range.startsWith('month-')) { const k = HF.range.slice(6); if (k === cm) HF.range = 'month'; else if (k === addMonths(cm, -1)) HF.range = 'prev'; }
  const o = [['week', 'Ez a hét'], ['month', 'Ez a hónap'], ['prev', cap(mName(addMonths(cm, -1)))], ['3m', 'Utolsó 3 hónap'], ['all', 'Teljes időszak'], ['planned', 'Tervezett tételek'], ['custom', 'Egyéni időszak…']];
  if (HF.range.startsWith('month-')) o.unshift([HF.range, cap(mName(HF.range.slice(6))) + ' ' + HF.range.slice(6, 10)]);
  return o;
}
function filteredTx() {
  const [from, to] = rangeBounds(HF.range);
  const q = HF.q.trim().toLowerCase();
  return S.transactions.filter(t => {
    if (t.date < from || t.date > to) return false;
    if (HF.type !== 'all' && t.type !== HF.type) return false;
    if (HF.acc !== 'all' && t.accountId !== HF.acc && t.toAccountId !== HF.acc) return false;
    if (HF.cat !== 'all' && t.categoryId !== HF.cat) return false;
    if (q) {
      const hay = [t.note, cat(t.categoryId)?.name, acc(t.accountId)?.name, acc(t.toAccountId)?.name, String(t.amount), fmtNum(t.amount)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
}

function histUpdate(enter) {

function bindSwipe(list) {
  let st = null, suppress = false;
  const reset = s => { s.row.classList.add('anim'); s.row.style.transform = ''; s.bg.style.opacity = '0'; };
  list.addEventListener('pointerdown', e => {
    const row = e.target.closest('.txr'); if (!row || e.button > 0) return;
    st = { row, wrap: row.parentElement, bg: row.previousElementSibling, x0: e.clientX, y0: e.clientY, dx: 0, mode: null };
    row.classList.remove('anim');
  });
  list.addEventListener('pointermove', e => {
    if (!st) return;
    const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.mode) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { st.mode = 'h'; try { st.row.setPointerCapture(e.pointerId); } catch (_) { } }
      else if (Math.abs(dy) > 10) { st = null; return; } else return;
    }
    st.dx = dx;
    st.row.style.transform = `translateX(${dx}px)`;
    st.bg.className = 'tx-bg ' + (dx < 0 ? 'l' : 'r');
    st.bg.style.opacity = String(clamp(Math.abs(dx) / 90, 0, 1));
  });
  const end = () => {
    if (!st) return; const s = st; st = null;
    if (s.mode !== 'h') return;
    suppress = true; setTimeout(() => suppress = false, 60);
    const id = s.wrap.dataset.id;
    if (s.dx < -96) {
      s.row.classList.add('anim'); s.row.style.transform = 'translateX(-105%)';
      setTimeout(() => {
        s.wrap.style.height = s.wrap.offsetHeight + 'px'; s.wrap.getBoundingClientRect();
        s.wrap.style.height = '0px'; s.wrap.style.opacity = '0';
        setTimeout(() => deleteTx(id), reduced() ? 0 : 250);
      }, reduced() ? 0 : 200);
    } else if (s.dx > 96) {
      reset(s); const t = S.transactions.find(x => x.id === id); if (t) setTimeout(() => openTxSheet({ tx: t }), 120);
    } else reset(s);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', () => { if (st) { reset(st); st = null; } });
  list.addEventListener('click', e => {
    if (suppress) return;
    const row = e.target.closest('.txr'); if (!row) return;
    const t = S.transactions.find(x => x.id === row.parentElement.dataset.id); if (t) openTxSheet({ tx: t });
  });
  list.addEventListener('keydown', e => {
    const row = e.target.closest('.txr'); if (!row) return;
    if (e.key === 'Enter') row.click();
    if (e.key === 'Delete' || e.key === 'Backspace') deleteTx(row.parentElement.dataset.id);
  });
}

function tlDraw(anim, selOnly) {
  const series = timelineSeries(TL.horizon, TL.wi);
  const keys = series.map(s => s.key).join(',');
  if (selOnly && TL.cur) { tlRender(TL.cur, TL.view); return; }
