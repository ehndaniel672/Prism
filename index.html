    body: `<div id="aPrev" aria-hidden="true">${preview()}</div>
      <label class="field"><span>Név (kötelező)</span><input class="input" id="aName" maxlength="30" placeholder="pl. OTP Mastercard" value="${esc(st.name)}" autocomplete="off"></label>
      <div class="field"><span>Típus</span><div class="type-grid" id="aType">${Object.entries(ACC_TYPES).map(([k, l]) => `<button class="chip ${k === st.type ? 'on' : ''}" data-type="${k}"><span class="cico" style="${cVars(8)}">${icon(ACC_ICON[k])}</span>${l}</button>`).join('')}</div><small class="type-note" id="aTypeNote">${ACC_TYPE_NOTE[st.type]}</small></div>
      <label class="field"><span>Pénznem</span><select class="select" id="aCur">${Object.entries(CURRENCIES).map(([k, v]) => `<option value="${k}" ${k === st.currency ? 'selected' : ''}>${k} – ${v.name}</option>`).join('')}</select></label>
      <label class="field"><span>Kezdő egyenleg</span><input class="input" id="aOpen" inputmode="decimal" value="${st.opening ? fmtNum(st.opening, 2).replace(/,00$/, '') : ''}" placeholder="0"></label>
      <div class="field"><span>Szín</span>${swatchesHTML(st.slot)}</div>
      <div class="field"><span>Ikon</span><div class="icon-grid" id="aIcons">${ACC_ICONS.map(n => `<button data-ic="${n}" class="${(st.icon || ACC_ICON[st.type]) === n ? 'on' : ''}" aria-label="${n}">${icon(n)}</button>`).join('')}</div></div>
      <div class="sheet-foot">${editing ? `<button class="btn danger" id="aDel" aria-label="Számla eltávolítása">${icon('trash-2')}</button>` : ''}<button class="btn primary" id="aSave">${editing ? 'Mentés' : 'Számla hozzáadása'}</button></div>`,
    onMount(sh, api) {
      const redraw = () => { $('#aPrev', sh).innerHTML = preview(); };
      const markIcons = () => $$('[data-ic]', sh).forEach(x => x.classList.toggle('on', x.dataset.ic === (st.icon || ACC_ICON[st.type])));
      $('#aName', sh).oninput = e => { st.name = e.target.value.trim(); redraw(); };
      $('#aCur', sh).onchange = e => { st.currency = e.target.value; redraw(); };
      $('#aOpen', sh).oninput = e => { const v = parseAmount(e.target.value || '0'); st.opening = isFinite(v) ? v : 0; redraw(); };
      $('#aType', sh).onclick = e => {
        const b = e.target.closest('[data-type]'); if (!b) return;
        st.type = b.dataset.type; $$('[data-type]', sh).forEach(x => x.classList.toggle('on', x === b));
        $('#aTypeNote', sh).textContent = ACC_TYPE_NOTE[st.type]; markIcons(); redraw();
      };
      $('#sw', sh).onclick = e => { const b = e.target.closest('[data-slot]'); if (!b) return; st.slot = +b.dataset.slot; $$('[data-slot]', sh).forEach(x => x.classList.toggle('on', x === b)); redraw(); };
      $('#aIcons', sh).onclick = e => { const b = e.target.closest('[data-ic]'); if (!b) return; st.icon = b.dataset.ic; markIcons(); redraw(); };
      $('#aSave', sh).onclick = () => {
        const name = $('#aName', sh).value.trim();
        if (!name) { shake($('#aName', sh)); $('#aName', sh).focus(); return toast('Adj meg egy nevet.'); }
        const o = parseAmount($('#aOpen', sh).value || '0');
        const fields = { name, type: st.type, currency: $('#aCur', sh).value, opening: isFinite(o) ? o : 0, slot: st.slot, icon: st.icon };
        if (editing) Object.assign(a, fields);
        else { const rec = { id: 'acc_' + uid(), ...fields }; S.accounts.push(rec); UI.focusAcc = rec.id; }
        save(); api.close(undefined, { plain: true }); detailApi && detailApi.close(true); refresh();
        toast(editing ? 'Számla mentve' : 'Számla hozzáadva');
        if (fields.currency !== 'HUF') fetchRates().then(ch => ch && refresh());
      };
      const del = $('#aDel', sh);
      if (del) del.onclick = () => { api.close(undefined, { plain: true }); setTimeout(() => openDeleteAccount(a), 200); };
    }
  });
}
const CAT_ICONS = ['shopping-cart', 'coffee', 'utensils', 'house', 'zap', 'bus', 'car', 'fuel', 'train-front', 'plane', 'repeat', 'film', 'music', 'gamepad-2', 'shopping-bag', 'shirt', 'gift', 'heart-pulse', 'dumbbell', 'book', 'graduation-cap', 'baby', 'paw-print', 'smartphone', 'receipt', 'landmark', 'briefcase', 'laptop', 'piggy-bank', 'coins', 'trending-up', 'sparkles', 'ellipsis'];
function openCategorySheet(c) {
  const editing = !!c;
  const st = c ? { ...c } : { name: '', kind: SETC.catKind, icon: 'sparkles', slot: 0 };
  const fallback = c && (c.id === 'c_other' || c.id === 'i_other');
  openSheet({
    title: editing ? 'Kategória szerkesztése' : 'Új kategória',
    body: `<label class="field"><span>Név</span><input class="input" id="cName" maxlength="30" value="${esc(st.name)}" placeholder="pl. Háziállat"></label>
      ${editing ? '' : segHTML('ckind2', [['expense', 'Kiadás'], ['income', 'Bevétel']], st.kind)}
      <div class="field"><span>Ikon</span><div class="icon-grid" id="cIcons">${CAT_ICONS.map(n => `<button data-ic="${n}" class="${st.icon === n ? 'on' : ''}" aria-label="${n}">${icon(n)}</button>`).join('')}</div></div>
      <div class="field"><span>Szín</span>${swatchesHTML(st.slot)}</div>
      <div class="sheet-foot">${editing && !fallback ? `<button class="btn danger" id="cDel" aria-label="Törlés">${icon('trash-2')}</button>` : ''}<button class="btn primary" id="cSave">Mentés</button></div>`,
    onMount(sh, api) {
      bindSeg(sh, 'ckind2', v => st.kind = v);
      $('#cIcons', sh).onclick = e => { const b = e.target.closest('[data-ic]'); if (!b) return; st.icon = b.dataset.ic; $$('[data-ic]', sh).forEach(x => x.classList.toggle('on', x === b)); };
      $('#sw', sh).onclick = e => { const b = e.target.closest('[data-slot]'); if (!b) return; st.slot = +b.dataset.slot; $$('[data-slot]', sh).forEach(x => x.classList.toggle('on', x === b)); };
      $('#cSave', sh).onclick = () => {
        const name = $('#cName', sh).value.trim(); if (!name) { shake($('#cName', sh)); return toast('Adj meg egy nevet.'); }
        const rec = Object.assign(c || { id: 'cat_' + uid() }, { name, kind: st.kind, icon: st.icon, slot: st.slot });
        if (!editing) S.categories.push(rec);
        save(); api.close(); refresh(); toast('Kategória mentve');
      };
      const del = $('#cDel', sh);
      if (del) del.onclick = async () => {
        const fb = c.kind === 'income' ? 'i_other' : 'c_other';
        const n = S.transactions.filter(t => t.categoryId === c.id).length;
        if (!await confirmDialog({ title: 'Kategória törlése', text: n ? `${n} tétel átkerül az „${cat(fb).name}” kategóriába.` : 'A kategória törlődik.', ok: 'Törlés', danger: true })) return;
        S.transactions.forEach(t => { if (t.categoryId === c.id) t.categoryId = fb; });
        S.recurring.forEach(r => { if (r.categoryId === c.id) r.categoryId = fb; });
        S.categories = S.categories.filter(x => x.id !== c.id);
        save(); api.close(); refresh(); toast('Kategória törölve');
      };
    }
  });
}

/* ---------------- Theme & boot ---------------- */
const MQ_LIGHT = window.matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const t = S.settings.theme || 'dark';
  const mode = t === 'system' ? (MQ_LIGHT.matches ? 'light' : 'dark') : t;
  document.documentElement.dataset.theme = mode;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = mode === 'light' ? '#eef0fb' : '#070a1c';
}
MQ_LIGHT.addEventListener?.('change', () => { if (S.settings.theme === 'system') { applyTheme(); renderPage(false); } });

function boot() {
  load(); applyTheme(); buildNav(); postDueRecurring();
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  window.addEventListener('hashchange', () => renderPage(true));
  renderPage(true);
  fetchRates().then(changed => { if (changed || route === 'settings') refresh(); });
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (today() !== lastDay) { lastDay = today(); postDueRecurring(); renderPage(false); }
    fetchRates().then(ch => ch && refresh());
  });
}
boot();

</script>
</body>
</html>
